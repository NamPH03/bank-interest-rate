name: Daily Vietnam Bank Rate Monitor

on:
  schedule:
    # 01:00 UTC = 08:00 AM (Vietnam Time UTC+7) every day
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger directly from GitHub web UI

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated rate monitor cycle
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'Bank Rate Monitor <onboarding@resend.dev>' }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LOG_LEVEL: info
        run: npm run run-once
